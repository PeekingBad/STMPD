# Gate 1: Dev Branch - Lint & TypeScript Check
# Triggered bij pushes en PRs naar dev branch
# Checkt alleen de frontend folder

name: "Gate 1: Dev - Lint & TypeScript Check"

on:
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  lint-and-typecheck:
    name: "🔍 Lint + TypeScript Check"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run TypeScript check
        run: npx tsc --noEmit
      
      - name: ✅ Gate 1 Passed
        run: echo "Gate 1 passed! Code quality checks completed. Ready for merge to acc branch."
# .github/workflows/gate-1-dev.yml
name: "Gate 1: Dev - Lint & TypeScript Check"

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  lint-and-typecheck:
    name: "🔍 Lint + TypeScript Check"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run TypeScript check
        run: npx tsc --noEmit
      
      - name: ✅ Gate 1 Passed
        run: echo "Gate 1 passed! Ready for merge to acc branch."
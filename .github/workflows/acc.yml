# Gate 2: Acceptance Branch - Lint & TypeScript Check
# Triggered bij pushes en PRs naar acc branch
# Checkt alleen de frontend folder
# Deployment wordt automatisch door Vercel gedaan

name: "Gate 2: Acceptance - Lint & TypeScript Check"

on:
  push:
    branches: [acc]
    paths:
      - "frontend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [acc]
    paths:
      - "frontend/**"
      - ".github/workflows/**"

jobs:
  lint-and-typecheck:
    name: "🏗️ Gate 2: Lint & TypeScript Check"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: ✅ Gate 2 Passed
        run: echo "All checks passed! Vercel will handle the preview deployment."

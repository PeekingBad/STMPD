# Gate 2 & 3: Acceptance Branch - Build, CMS Check & Preview Deploy
# Triggered bij pushes en PRs naar acc branch
# Checkt alleen de frontend folder

name: "Gate 2 & 3: Acceptance - Build & CMS Check"

on:
  push:
    branches: [acc]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [acc]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # Gate 2: Build + CI Pipeline
  build:
    name: "🏗️ Gate 2: Build & CI Pipeline"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npx eslint .
      
      - name: Run TypeScript check
        run: npx tsc --noEmit
      
      - name: Build application (SSR/SSG test)
        run: npm run build
        env:
          NEXT_PUBLIC_STRAPI_URL: ${{ secrets.STRAPI_URL }}
          # Voeg hier andere environment variables toe die je nodig hebt
          # NEXT_PUBLIC_API_KEY: ${{ secrets.API_KEY }}
      
      - name: ✅ Gate 2 Passed
        run: echo "Build successful! Application compiles without errors."

  # Gate 3: CMS Connection + API Health Check
  cms-health-check:
    name: "🔌 Gate 3: Strapi CMS Health Check"
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Check Strapi API Health
        run: |
          echo "Checking Strapi CMS connection..."
          
          # Health check op je Strapi instance
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STRAPI_URL }}" --max-time 30 || echo "000")
          
          echo "Response code: $RESPONSE"
          
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "✅ Strapi CMS is bereikbaar (HTTP $RESPONSE)"
          else
            echo "❌ Strapi CMS niet bereikbaar (HTTP $RESPONSE)"
            echo "Check of STRAPI_URL secret correct is ingesteld"
            exit 1
          fi
      
      - name: ✅ Gate 3 Passed
        run: echo "CMS health check passed! Strapi is online and responding."

  # Deploy naar Vercel Preview
  deploy-preview:
    name: "🚀 Deploy to Vercel Preview"
    runs-on: ubuntu-latest
    needs: [build, cms-health-check]
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      
      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Build Project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_STRAPI_URL: ${{ secrets.STRAPI_URL }}
      
      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "🔗 Preview URL: $URL"
      
      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Preview Deployment Ready!**\n\n🔗 Preview URL: ${{ steps.deploy.outputs.preview_url }}\n\n✅ All Gate 2 & 3 checks passed!'
            })
      
      - name: ✅ Preview Deployment Complete
        run: echo "Preview deployment successful! URL - ${{ steps.deploy.outputs.preview_url }}"
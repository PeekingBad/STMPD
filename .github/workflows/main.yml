# Gate 4: Production Branch - Final Quality Checks
# Triggered bij pushes en PRs naar main branch
# Checkt alleen de frontend folder
# Deployment wordt automatisch door Vercel gedaan

name: "Gate 4: Production - Final Quality Checks"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  final-checks:
    name: "Final Quality Checks"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npx eslint .
      
      - name: Run TypeScript check
        run: npx tsc --noEmit
      
      - name: ✅ Final Quality Checks Passed
        run: echo "All quality checks passed! Vercel will handle the production deployment."
# Gate 4: Production Branch - Final Release
# Triggered bij pushes en PRs naar main branch
# Checkt alleen de frontend folder

name: "Gate 3: Production - Final Release"

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]


env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # Alle checks opnieuw voor productie
  final-checks:
    name: "🔒 Final Quality Checks"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npx eslint .
      
      - name: Run TypeScript check
        run: npx tsc --noEmit
      
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_STRAPI_URL: ${{ secrets.STRAPI_URL_PRODUCTION }}
          # Voeg hier andere production environment variables toe
          # NEXT_PUBLIC_API_KEY: ${{ secrets.API_KEY_PRODUCTION }}
      
      - name: ✅ All Checks Passed
        run: echo "All quality checks passed! Ready for production deployment."

  # Strapi Production Health Check
  cms-health-check-production:
    name: "🔌 Strapi Production Health Check"
    runs-on: ubuntu-latest
    needs: final-checks
    
    steps:
      - name: Check Strapi Production API
        run: |
          echo "Checking Strapi Production CMS..."
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STRAPI_URL_PRODUCTION }}" --max-time 30 || echo "000")
          
          echo "Response code: $RESPONSE"
          
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "✅ Strapi Production CMS is bereikbaar (HTTP $RESPONSE)"
          else
            echo "❌ Strapi Production CMS niet bereikbaar (HTTP $RESPONSE)"
            echo "Check of STRAPI_URL_PRODUCTION secret correct is ingesteld"
            exit 1
          fi
      
      - name: ✅ Production CMS Check Passed
        run: echo "Production CMS is online and ready!"

  # Deploy naar Vercel Production
  deploy-production:
    name: "🚀 Gate 4: Deploy to Production"
    runs-on: ubuntu-latest
    needs: [final-checks, cms-health-check-production]
    # Alleen deployen op push naar main, niet op PR
    if: github.event_name == 'push'
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      
      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_STRAPI_URL: ${{ secrets.STRAPI_URL_PRODUCTION }}
      
      - name: Deploy to Vercel Production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "production_url=$URL" >> $GITHUB_OUTPUT
          echo "🎉 Production URL: $URL"
      
      - name: 🎉 Production Release Complete
        run: |
          echo "=========================================="
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL!"
          echo "=========================================="
          echo "URL: ${{ steps.deploy.outputs.production_url }}"
          echo "=========================================="
name: CI

on:
  push:
    branches: [dev, acc, main]
  pull_request:
    branches: [dev, acc, main]

jobs:
  test_dev:
    name: Lint & Test (dev)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm test --if-present

  build_acc:
    name: Build check (acc)
    if: github.ref == 'refs/heads/acc'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build      # SSR/SSG build check

  build_main:
    name: Build check (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build      # extra safety voor live
